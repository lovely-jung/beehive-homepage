<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>운영 관리 | 비하이브</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--ink:#26241f;--soft:#77736d;--line:#e8e4dc;--paper:#f6f4ef;--orange:#e9822d;--blue:#3158de;--green:#4f7a45;--red:#b23b25}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;height:60px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line)}
.top b{font-size:19px;letter-spacing:-.04em}.top b i{font-style:normal;color:var(--orange)}
.top span{font-size:13px;color:var(--soft)}
.top button{padding:7px 14px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:13px}
/* 로그인 */
.login{max-width:380px;margin:12vh auto;padding:32px;border-radius:20px;background:#fff;border:1px solid var(--line)}
.login h1{margin:0 0 6px;font-size:22px}.login p{margin:0 0 20px;font-size:13.5px;color:var(--soft)}
.login label{display:block;margin:12px 0 6px;font-size:13px;font-weight:700}
.login input{width:100%;padding:12px 13px;border:1px solid #ddd6ca;border-radius:10px;font:15px inherit}
.login button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:99px;background:var(--ink);color:#fff;font-weight:700}
.msg{margin-top:12px;font-size:13px;color:var(--red)}
/* 본문 */
.wrap{display:grid;grid-template-columns:380px minmax(0,1fr);height:calc(100vh - 60px)}
.list{overflow:auto;border-right:1px solid var(--line);background:#fff}
.tabs{position:sticky;top:0;display:flex;flex-wrap:wrap;gap:6px;padding:14px;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:12.5px;color:#5f5a52}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs em{font-style:normal;margin-left:4px;opacity:.7}
.item{display:block;width:100%;padding:14px 16px;border:0;border-bottom:1px solid #f0ede7;background:#fff;text-align:left}
.item:hover{background:#faf8f4}.item[aria-current="true"]{background:#fff6ec}
.item b{display:block;font-size:14.5px}.item small{display:block;margin-top:4px;font-size:12.5px;color:var(--soft)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:#eee;color:#555;vertical-align:1px}
.st-submitted{background:#fff1df;color:#9a5a1c}.st-proposal_ready{background:#e8edfb;color:#2d48a8}.st-proposal_sent{background:#efe9fb;color:#5a3aa8}
.st-confirmed{background:#e6f1e2;color:var(--green)}.st-cancelled{background:#eee;color:#888}
.detail{overflow:auto;padding:26px 30px 60px}
.empty{color:var(--soft);font-size:14px;padding:40px 0}
.card{margin-bottom:16px;padding:22px 24px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.card h2{margin:0 0 14px;font-size:18px;letter-spacing:-.03em;display:flex;justify-content:space-between;align-items:center;gap:10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 14px;margin:0;font-size:14px}
.kv dt{color:var(--soft)}.kv dd{margin:0;word-break:keep-all}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{padding:10px 18px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:13.5px;font-weight:700}
.btn.main{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.edit label{display:block;margin:10px 0 6px;font-size:12.5px;font-weight:700;color:var(--soft)}
.edit input,.edit textarea{width:100%;padding:11px 12px;border:1px solid #ddd6ca;border-radius:10px;font:14px/1.6 inherit}
.edit textarea{min-height:380px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.quote{display:inline-block;padding:4px 12px;border-radius:99px;background:#fff1df;color:#9a5a1c;font-size:13px;font-weight:800}
.mail iframe{width:100%;height:520px;border:1px solid var(--line);border-radius:12px;background:#fff}
.note{margin:10px 0 0;font-size:12.5px;color:var(--soft);line-height:1.6}
.toast{position:fixed;right:20px;bottom:20px;max-width:380px;padding:13px 18px;border-radius:12px;background:var(--ink);color:#fff;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}.toast.bad{background:var(--red)}
@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}.list{max-height:45vh}}
</style>
</head>
<body>
<header class="top"><b>beehive<i>.</i> 운영 관리</b><span id="who"></span></header>

<section class="login" id="login" hidden>
  <h1>관리자 로그인</h1>
  <p>교육 의뢰를 확인하고 제안서를 승인 · 발송하는 화면입니다.</p>
  <form id="loginForm">
    <label for="em">이메일</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">로그인</button>
    <div class="msg" id="loginMsg" role="alert"></div>
    <p style="margin:14px 0 0;text-align:center"><button type="button" id="forgot" style="border:0;background:none;color:#77736d;font-size:13px;text-decoration:underline">비밀번호를 잊으셨나요?</button></p>
  </form>
</section>

<!-- 초대 메일 · 비밀번호 재설정 링크로 들어왔을 때 -->
<section class="login" id="setpw" hidden>
  <h1>비밀번호 정하기</h1>
  <p>운영 관리 화면에 로그인할 비밀번호를 정해 주세요. (8자 이상)</p>
  <form id="pwForm">
    <label for="pw1">새 비밀번호</label><input id="pw1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="pw2">한 번 더</label><input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">비밀번호 저장</button>
    <div class="msg" id="pwMsg" role="alert"></div>
  </form>
</section>

<div class="wrap" id="app" hidden>
  <aside class="list"><div class="tabs" id="tabs" role="group" aria-label="진행 상태"></div><div id="items"></div></aside>
  <main class="detail" id="detail"><p class="empty">왼쪽에서 의뢰를 골라 주세요.</p></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="assets/js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  // 초대 · 재설정 링크(#...type=invite / recovery)는 클라이언트가 주소를 읽기 전에 먼저 확인해 둡니다
  var linkType = (location.hash.match(/type=(invite|recovery)/) || [])[1] || null;
  var CFG = window.BH_SUPABASE, sb = window.supabase.createClient(CFG.url, CFG.key);
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); };
  var won = function (n) { return n == null ? '-' : Number(n).toLocaleString('ko-KR') + '원'; };
  var when = function (t) { return t ? new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; };
  var newKey = function () { return (crypto.randomUUID ? crypto.randomUUID() : Date.now() + Math.random().toString(36).slice(2)) + '-adm'; };

  var ST = { submitted: '접수됨', proposal_ready: '제안서 초안', proposal_sent: '발송됨', confirmed: '교육 확정', cancelled: '취소' };
  var ORG = { school: '학교', university: '대학', public: '공공기관', company: '기업', other: '기타' };
  var LV = { elem: '초등', mid: '중등', high: '고등', univ: '대학', adult: '교원' };
  var MAIL = { preview: '미발송 (미리보기)', sent: '발송 완료', failed: '발송 실패' };
  var rows = [], filter = 'all', current = null;

  function toast(m, bad) { var t = $('toast'); t.textContent = m; t.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(t._h); t._h = setTimeout(function () { t.className = 'toast'; }, 3500); }

  /* ---------- 로그인 ---------- */
  async function boot() {
    var s = (await sb.auth.getSession()).data.session;
    if (s && linkType) { $('login').hidden = true; $('app').hidden = true; $('setpw').hidden = false; return; }
    if (!s) { $('login').hidden = false; $('app').hidden = true; $('who').textContent = ''; return; }
    var p = await sb.from('profiles').select('role, name').eq('id', s.user.id).maybeSingle();
    if (!p.data || p.data.role !== 'admin') {
      await sb.auth.signOut(); $('login').hidden = false; $('loginMsg').textContent = '관리자 권한이 없는 계정입니다.'; return;
    }
    $('login').hidden = true; $('app').hidden = false;
    $('who').innerHTML = esc(p.data.name || s.user.email) + ' · <button type="button" id="logout">로그아웃</button>';
    $('logout').onclick = async function () { await sb.auth.signOut(); location.reload(); };
    load();
  }
  $('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault(); $('loginMsg').textContent = '';
    var r = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    if (r.error) { $('loginMsg').textContent = '이메일 또는 비밀번호를 확인해 주세요.'; return; }
    boot();
  });

  $('pwForm').addEventListener('submit', async function (e) {
    e.preventDefault(); $('pwMsg').textContent = '';
    if ($('pw1').value !== $('pw2').value) { $('pwMsg').textContent = '두 비밀번호가 다릅니다.'; return; }
    var r = await sb.auth.updateUser({ password: $('pw1').value });
    if (r.error) { $('pwMsg').textContent = '저장하지 못했습니다: ' + r.error.message; return; }
    linkType = null; history.replaceState(null, '', location.pathname); $('setpw').hidden = true;
    toast('비밀번호를 저장했습니다.'); boot();
  });
  $('forgot').addEventListener('click', async function () {
    var em = $('em').value.trim();
    if (!em) { $('loginMsg').textContent = '이메일을 먼저 입력해 주세요.'; return; }
    await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
    $('loginMsg').style.color = '#4f7a45'; $('loginMsg').textContent = '가입된 주소라면 비밀번호 재설정 메일을 보냈습니다.';
  });

  /* ---------- 의뢰 목록 ---------- */
  async function load(keepId) {
    var r = await sb.from('requests').select('*').order('created_at', { ascending: false }).limit(300);
    if (r.error) { toast('목록을 불러오지 못했습니다: ' + r.error.message, true); return; }
    rows = r.data; renderTabs(); renderList();
    if (keepId) open(keepId);
  }
  function renderTabs() {
    var cnt = function (k) { return rows.filter(function (x) { return k === 'all' || x.status === k; }).length; };
    $('tabs').innerHTML = ['all', 'submitted', 'proposal_ready', 'proposal_sent', 'confirmed', 'cancelled'].map(function (k) {
      return '<button type="button" data-k="' + k + '" aria-pressed="' + (filter === k) + '">' + (k === 'all' ? '전체' : ST[k]) + '<em>' + cnt(k) + '</em></button>';
    }).join('');
  }
  $('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; filter = b.dataset.k; renderTabs(); renderList(); });
  function renderList() {
    var list = rows.filter(function (x) { return filter === 'all' || x.status === filter; });
    $('items').innerHTML = list.map(function (x) {
      return '<button type="button" class="item" data-id="' + x.id + '" aria-current="' + (current === x.id) + '"><b>' + esc(x.org_name) + ' <span class="badge st-' + x.status + '">' + ST[x.status] + '</span></b>' +
        '<small>' + esc(courseTitle(x.course_id)) + ' · ' + (LV[x.level] || x.level) + ' · ' + x.sessions + '차시 · ' + when(x.created_at) + '</small></button>';
    }).join('') || '<p class="empty" style="padding:20px">해당하는 의뢰가 없습니다.</p>';
  }
  $('items').addEventListener('click', function (e) { var b = e.target.closest('.item'); if (b) open(b.dataset.id); });

  var COURSES = null;
  function courseTitle(id) { var c = (COURSES || []).filter(function (x) { return x.id === id; })[0]; return c ? c.title : id; }
  // 수업 이름 표시용 (공개 사이트 데이터)
  var sc = document.createElement('script'); sc.src = 'assets/data/courses.js';
  sc.onload = function () { COURSES = window.BH_COURSES; renderList(); }; document.head.appendChild(sc);

  /* ---------- 의뢰 상세 ---------- */
  async function open(id) {
    current = id; renderList();
    var r = rows.filter(function (x) { return x.id === id; })[0]; if (!r) return;
    var ps = await sb.from('proposals').select('*').eq('request_id', id).order('version', { ascending: false });
    var ms = await sb.from('email_outbox').select('*').eq('request_id', id).order('created_at', { ascending: false });
    var p = (ps.data || []).filter(function (x) { return x.status !== 'superseded'; })[0];
    var mail = (ms.data || [])[0];
    var h = '<div class="card"><h2>' + esc(r.org_name) + ' <span class="badge st-' + r.status + '">' + ST[r.status] + '</span></h2><dl class="kv">' +
      '<dt>수업</dt><dd>' + esc(courseTitle(r.course_id)) + '</dd>' +
      '<dt>대상</dt><dd>' + (LV[r.level] || r.level) + (r.class_count ? ' · ' + r.class_count + '학급' : '') + (r.headcount ? ' · ' + r.headcount + '명' : '') + '</dd>' +
      '<dt>구성</dt><dd>' + r.sessions + '차시 × ' + r.minutes_per_session + '분</dd>' +
      '<dt>희망 일정</dt><dd>' + esc(r.preferred_dates || '-') + '</dd><dt>장소</dt><dd>' + esc(r.location || '-') + '</dd>' +
      '<dt>요청 사항</dt><dd>' + esc(r.notes || '-') + '</dd>' +
      '<dt>기관 유형</dt><dd>' + (ORG[r.org_type] || r.org_type) + '</dd>' +
      '<dt>담당자</dt><dd>' + esc(r.contact_name) + ' · ' + esc(r.contact_email) + (r.contact_phone ? ' · ' + esc(r.contact_phone) : '') + '</dd>' +
      '<dt>접수</dt><dd>' + new Date(r.created_at).toLocaleString('ko-KR') + '</dd></dl></div>';

    // 제안서
    if (!p) {
      h += '<div class="card"><h2>제안서</h2><p class="note">아직 제안서가 없습니다. 수업 데이터와 견적 기준으로 초안을 만듭니다.</p>' +
        '<div class="btns"><button class="btn main" data-act="generate_proposal" data-key="' + newKey() + '">제안서 초안 만들기</button></div></div>';
    } else {
      var draft = p.status === 'draft';
      h += '<div class="card edit"><h2>제안서 (' + p.version + '번째' + (draft ? ' · 초안' : ' · 발송됨') + ')' + (p.quote_total != null ? ' <span class="quote">견적 ' + won(p.quote_total) + '</span>' : '') + '</h2>' +
        '<label for="pt">제목</label><input id="pt" value="' + esc(p.title) + '"' + (draft ? '' : ' readonly') + '>' +
        '<label for="pc">본문 (마크다운: # 제목, - 목록, | 표 |, **굵게**)</label><textarea id="pc"' + (draft ? '' : ' readonly') + '>' + esc(p.content_md) + '</textarea>' +
        (draft ? '<div class="btns"><button class="btn" data-act="save_proposal" data-pid="' + p.id + '">수정 저장</button>' +
          (ps.data.length < 3 ? '<button class="btn" data-act="generate_proposal" data-key="' + newKey() + '">초안 다시 만들기</button>' : '') +
          '<button class="btn main" data-act="approve_send" data-pid="' + p.id + '" data-key="' + newKey() + '">승인하고 학교로 발송</button></div>' +
          '<p class="note">견적 금액을 바꾸려면 본문 견적표를 직접 고친 뒤 저장하세요. 승인하면 담당자 메일로 제안서와 <b>교육 진행하기</b> 버튼이 나갑니다.</p>'
          : '<p class="note">' + (p.confirmed_at ? '학교가 ' + new Date(p.confirmed_at).toLocaleString('ko-KR') + '에 <b>교육 진행하기</b>를 눌렀습니다. 다음 단계: 강사 배정 (준비 중)' : '학교의 <b>교육 진행하기</b> 응답을 기다리는 중입니다.') + '</p>') +
        '</div>';
    }

    // 메일
    if (mail) {
      h += '<div class="card mail"><h2>보낸 메일 <span class="badge ' + (mail.status === 'sent' ? 'st-confirmed' : mail.status === 'failed' ? 'st-submitted' : 'st-proposal_ready') + '">' + MAIL[mail.status] + '</span></h2>' +
        '<p class="note">받는 사람: ' + esc(mail.to_email) + ' · 제목: ' + esc(mail.subject) + (mail.error ? ' · 비고: ' + esc(mail.error) : '') + '</p>' +
        (mail.status !== 'sent' ? '<div class="btns"><button class="btn dark" data-act="resend_mail" data-oid="' + mail.id + '" data-key="' + newKey() + '">메일 보내기</button>' +
          '<button class="btn" data-copy="' + mail.id + '">본문 복사</button>' +
          '<button class="btn" data-act="mark_mail_sent" data-oid="' + mail.id + '">직접 보냈음으로 표시</button></div>' +
          '<p class="note">메일 발송 설정이 없으면 여기서 본문을 복사해 내 메일로 직접 보낸 뒤 <b>직접 보냈음으로 표시</b>를 눌러 주세요.</p>' : '') +
        '<iframe title="메일 미리보기" sandbox="" srcdoc="' + esc(mail.body_html) + '"></iframe></div>';
    }
    $('detail').innerHTML = h;
    $('detail')._mail = mail;
  }

  /* ---------- 버튼 동작 (서버 기능 admin-action 호출) ---------- */
  $('detail').addEventListener('click', async function (e) {
    var cp = e.target.closest('[data-copy]');
    if (cp) {
      var m = $('detail')._mail, html = m.body_html;
      try { await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([html.replace(/<[^>]+>/g, '')], { type: 'text/plain' }) })]); toast('메일 본문을 복사했습니다. 메일 쓰기 화면에 붙여 넣으세요.'); }
      catch (_) { toast('복사하지 못했습니다. 미리보기 내용을 직접 선택해 복사해 주세요.', true); }
      return;
    }
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var act = b.dataset.act;
    if (act === 'approve_send' && !confirm('이 제안서를 승인하고 학교 담당자에게 발송할까요?')) return;
    if (act === 'mark_mail_sent' && !confirm('이 메일을 직접 보냈다고 표시할까요?')) return;
    var body = { action: act, key: b.dataset.key || newKey(), request_id: current, proposal_id: b.dataset.pid, outbox_id: b.dataset.oid };
    if (act === 'save_proposal') { body.title = $('pt').value; body.content_md = $('pc').value; }
    b.disabled = true;
    try {
      var s = (await sb.auth.getSession()).data.session;
      var res = await fetch(CFG.functions + '/admin-action', { method: 'POST', headers: { 'content-type': 'application/json', apikey: CFG.key, authorization: 'Bearer ' + s.access_token }, body: JSON.stringify(body) });
      var out = await res.json().catch(function () { return {}; });
      if (!res.ok || out.error) throw new Error(out.error || '처리하지 못했습니다');
      var M = { generate_proposal: '제안서 초안을 만들었습니다.', save_proposal: '저장했습니다.', mark_mail_sent: '발송 완료로 표시했습니다.', resend_mail: '메일을 보냈습니다.',
        approve_send: out.mail === 'sent' ? '승인하고 메일을 보냈습니다.' : out.mail === 'failed' ? '승인했지만 메일 발송에 실패했습니다: ' + (out.mail_error || '') : '승인했습니다. 메일 발송 설정이 없어 미리보기로 저장했습니다.' };
      toast(out.duplicate ? '이미 처리된 요청입니다.' : M[act], out.mail === 'failed');
      await load(current);
    } catch (err) { toast(err.message, true); b.disabled = false; if (b.dataset.key) b.dataset.key = newKey(); /* 실패한 요청은 새 키로 다시 시도 */ }
  });

  sb.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') { linkType = 'recovery'; $('login').hidden = true; $('setpw').hidden = false; } if (ev === 'SIGNED_OUT') { $('app').hidden = true; $('login').hidden = false; } });
  boot();
})();
</script>
