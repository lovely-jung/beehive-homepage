<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교육 진행 확인 | 비하이브</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="assets/css/common.css">
<link rel="stylesheet" href="assets/css/pages.css">
<style>
.cf{min-height:70vh;display:grid;place-items:center;padding:calc(var(--nav-h) + 40px) 0 80px;background:var(--paper)}
.cf-box{width:min(560px,calc(100% - 40px));padding:46px 34px;border-radius:24px;background:#fff;text-align:center}
.cf-ic{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 18px;border-radius:50%;font-size:32px}
.ok .cf-ic{background:#e9f1e4;color:#4f7a45}.already .cf-ic{background:#e8edfc;color:#3158de}.invalid .cf-ic{background:#fdecea;color:#a3341f}
.cf-box h1{margin:0 0 12px;font-size:26px;letter-spacing:-.04em}
.cf-box p{margin:0 auto 24px;max-width:420px;font-size:15px;line-height:1.8;color:#6f6a62}
</style>
</head>
<body class="no-note">
<div id="site-nav"></div>
<script src="assets/data/courses.js"></script>
<script src="assets/js/site.js"></script>
<main class="cf"><div class="cf-box" id="box"></div></main>
<div id="site-footer"></div>
<script>
(function () {
  var s = new URLSearchParams(location.search).get('s');
  var V = {
    ok: ['✓', '교육이 확정되었습니다', '감사합니다. 담당 강사를 배정한 뒤 일정과 세부 사항을 메일로 다시 안내드리겠습니다.'],
    already: ['✓', '이미 확정된 교육입니다', '교육 진행이 이미 확정되어 있습니다. 강사 배정 후 안내를 기다려 주세요.'],
    invalid: ['!', '확인할 수 없는 링크입니다', '링크가 잘못되었거나 만료되었습니다. 받으신 메일에 답장하시거나 교육 문의로 연락해 주세요.']
  };
  var v = V[s] || V.invalid, box = document.getElementById('box');
  box.className = 'cf-box ' + (V[s] ? s : 'invalid');
  box.innerHTML = '<div class="cf-ic">' + v[0] + '</div><h1>' + v[1] + '</h1><p>' + v[2] + '</p><a class="text-link" href="./">비하이브 홈으로 <span>↗</span></a>';
})();
</script>
</body>
</html>
